version: 2
updates:
  # Keeps the SHA-pinned actions current; Dependabot updates the SHA and the version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
  # Documentation site build dependencies (hash-locked in docs/requirements.txt)
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
    groups:
      docs:
        patterns: ["*"]
    commit-message:
      prefix: docs
  # Tools the CI, security and release workflows install (hash-locked in .github/requirements/*.txt)
  - package-ecosystem: pip
    directory: /.github/requirements
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ["*"]
    commit-message:
      prefix: ci
