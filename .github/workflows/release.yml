name: Release

# Push a tag like v0.1.0 to publish a release. The pipeline:
#   1. builds and tests the Python package, and checks the tag matches the package version
#   2. builds the container image from that exact wheel and blocks on fixable critical CVEs
#   3. pushes the image to GHCR, signs it with cosign (keyless, Sigstore)
#   4. generates CycloneDX SBOMs and signed SLSA build provenance for the wheel, sdist and image
#   5. runs wimi on its own image and attaches the provenance report
#   6. creates the GitHub Release with every artifact and a SHA256SUMS file

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_VERSION: "0.75.0"
  TRIVY_SHA256: "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

jobs:
  build:
    name: Build and test package
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the tagged commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Tag must match the package version
        run: |
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          mod=$(python -c "import whats_in_my_image as m; print(m.__version__)")
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag pyproject=$pkg module=$mod"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$mod" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $pkg/$mod"
            exit 1
          fi
      - run: python -m unittest discover -s tests
      - run: python -m pip install build==1.6.1
      - run: python -m build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: Image, signatures, SBOMs, provenance, release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      packages: write # push the image to GHCR
      id-token: write # keyless Sigstore signing (cosign and attestations)
      attestations: write # store build provenance and SBOM attestations
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set release variables
        run: |
          {
            echo "VERSION=${GITHUB_REF_NAME#v}"
            echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}"
            echo "BASE_IMAGE=$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile)"
            echo "WHEEL=$(basename dist/*.whl)"
          } >> "$GITHUB_ENV"

      - name: Install Trivy (checksum verified)
        run: |
          curl -sSfL -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum --check --strict
          tar -xzf trivy.tgz trivy && sudo mv trivy /usr/local/bin/ && rm trivy.tgz

      - name: Build container image
        run: |
          # The signed wheel goes in through its own build context, so the image contains exactly that file.
          docker build --build-arg WHEEL=dist --build-context dist=dist/ \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "${IMAGE}:${VERSION}" -t "${IMAGE}:latest" .
          docker run --rm "${IMAGE}:${VERSION}" --version

      - name: Block release on fixable critical vulnerabilities
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 "${IMAGE}:${VERSION}"

      - name: Push image to GHCR
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "${IMAGE}:${VERSION}"
          docker push "${IMAGE}:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "${IMAGE}:${VERSION}" | cut -d@ -f2)
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless)
        run: cosign sign --yes "${IMAGE}@${IMAGE_DIGEST}"

      - name: Generate SBOMs (CycloneDX)
        run: |
          mkdir -p release
          trivy image --format cyclonedx --output "release/wimi-${VERSION}-image.cdx.json" "${IMAGE}@${IMAGE_DIGEST}"
          python -m pip install --quiet --no-index --target /tmp/sbom-root/lib/python3/site-packages dist/*.whl
          trivy rootfs --format cyclonedx --output "release/wimi-${VERSION}-python.cdx.json" /tmp/sbom-root

      - name: Build provenance for the Python package
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: SBOM attestation for the wheel
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: dist/*.whl
          sbom-path: release/wimi-${{ env.VERSION }}-python.cdx.json
      - name: Build provenance for the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # only available to organisation-owned repositories
      - name: SBOM attestation for the image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: release/wimi-${{ env.VERSION }}-image.cdx.json
          push-to-registry: true

      - name: Provenance report of wimi's own image (dogfooding)
        run: |
          python -m pip install --quiet --no-index dist/*.whl
          wimi "docker:${IMAGE}:${VERSION}" \
            --base "Red Hat UBI 9 Python 3.12=${BASE_IMAGE}" \
            --app-name "wimi ${VERSION} release build" \
            --subtitle "Provenance of the wimi ${VERSION} container image" \
            --scan trivy -o report --formats html,json
          cp report/*.html "release/wimi-${VERSION}-image-provenance.html"
          cp report/*.json "release/wimi-${VERSION}-image-provenance.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp dist/* release/
          (cd release && sha256sum -- * > SHA256SUMS)
          awk -v v="## [${VERSION}]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on' CHANGELOG.md > notes.md
          cat >> notes.md <<EOF

          ## Container image

          \`${IMAGE}:${VERSION}\` (digest \`${IMAGE_DIGEST}\`)

          ## Verify this release

          \`\`\`bash
          gh attestation verify ${WHEEL} --repo ${GITHUB_REPOSITORY}
          gh attestation verify oci://${IMAGE}:${VERSION} --repo ${GITHUB_REPOSITORY}
          cosign verify ${IMAGE}@${IMAGE_DIGEST} \\
            --certificate-identity-regexp "^${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum --check SHA256SUMS
          \`\`\`
          EOF
          gh release create "${GITHUB_REF_NAME}" release/* \
            --title "v${VERSION}" --notes-file notes.md --verify-tag
